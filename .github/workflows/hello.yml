name: My First Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from the greet job."

  inspect:
    runs-on: ubuntu-latest
    needs: greet
    steps:
      - uses: actions/checkout@v4

      - name: Report system info
        run: |
          echo "Running on: $(uname -a)"
          df -h
          pwd
